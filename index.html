<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Learning App SBO — cahiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --encre:#252B37; --doux:#5c6574; --filet:#DCEBEF; --teal:#007A90; --fond:#FBFAF8; --rail:#F2F7F8; --papier:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; background:#f4f1ea; color:var(--encre); font:16px/1.5 Nunito, sans-serif; }
  header.barre { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--filet); padding:14px 22px 10px; }
  header.barre p { margin:0 0 10px; color:var(--doux); font-size:13px; }
  .pills { display:flex; flex-wrap:wrap; gap:8px; }
  button.pill { border:1px solid var(--filet); background:#fff; color:var(--encre); font:700 14px/1 Nunito, sans-serif; padding:8px 12px; border-radius:999px; cursor:pointer; }
  button.pill.on { background:var(--teal); color:#fff; border-color:var(--teal); }
  main { max-width:1100px; margin:0 auto; padding:22px; }
  h1,h2,h3 { font-family:"League Spartan", sans-serif; letter-spacing:-.03em; margin:0 0 8px; }
  h1 { font-size:32px; } h2 { font-size:22px; margin-top:22px; } h3 { font-size:17px; margin-top:16px; }
  p { margin:0 0 10px; } .muted { color:var(--doux); font-size:14px; }
  .stats { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; }
  .stat { background:#fff; border:1px solid var(--filet); border-radius:14px; padding:10px 14px; min-width:120px; }
  .stat b { display:block; font-family:"League Spartan", sans-serif; font-size:22px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .card { background:#fff; border:1px solid var(--filet); border-radius:16px; padding:14px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--filet); border-radius:12px; overflow:hidden; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--filet); vertical-align:top; }
  th { background:var(--rail); font-size:12px; }
  details { background:#fff; border:1px solid var(--filet); border-radius:12px; padding:8px 12px; margin:8px 0; }
  summary { cursor:pointer; font-weight:700; }
  ul { margin:8px 0 0; padding-left:18px; }
  .panneau { display:none; } .panneau.on { display:block; }
  .coque { display:flex; min-height:640px; background:var(--fond); border:1px solid var(--filet); border-radius:16px; overflow:hidden; color:var(--encre); }
  .rail { width:180px; flex:none; background:var(--rail); padding:14px 8px; display:flex; flex-direction:column; gap:6px; }
  .rail .logo { width:28px; height:28px; margin:0 8px 8px; position:relative; }
  .rail .logo i { position:absolute; border-radius:99px; }
  .rail button, .rail span { display:block; width:100%; text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:12px; font:700 13px/1.2 Nunito, sans-serif; color:var(--encre); }
  .rail .qui { margin-top:auto; background:#fff; border-radius:14px; padding:10px; }
  .scene { flex:1; padding:18px; min-width:0; }
  .hero { background:var(--teal); color:#fff; border-radius:20px; padding:20px 22px; }
  .onglets { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0; }
  .onglets button { border:1px solid var(--filet); background:#fff; border-radius:999px; padding:8px 12px; font:700 13px Nunito, sans-serif; cursor:pointer; }
  .onglets button.on { background:var(--teal); color:#fff; border-color:var(--teal); }
  .carte { display:flex; gap:12px; align-items:center; background:#fff; border:1px solid var(--filet); border-radius:16px; padding:12px; margin:8px 0; width:100%; text-align:left; cursor:pointer; color:inherit; font:inherit; }
  .vignette { width:72px; height:56px; border-radius:12px; background:#E8F4F7; flex:none; }
  .note { background:#fff7e8; border-radius:12px; padding:10px 12px; margin:8px 0; }
  .modale { position:relative; min-height:480px; }
  .voile { opacity:.35; }
  .boite { position:absolute; inset:28px; background:#fff; border:1px solid var(--filet); border-radius:20px; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .niveaux { display:flex; flex-wrap:wrap; gap:8px; }
  .niveaux button, .actions button { border:0; border-radius:999px; padding:8px 12px; font:700 13px Nunito, sans-serif; cursor:pointer; background:#E8F4F7; color:#036273; }
  .niveaux button.on, .solid { background:var(--teal) !important; color:#fff !important; border-radius:10px !important; }
  .lock { color:var(--doux); }
  .maquette { display:grid; grid-template-columns:230px 1fr; gap:12px; align-items:start; }
  .menu-pages { display:flex; flex-direction:column; gap:4px; }
  .menu-pages button { text-align:left; border:1px solid transparent; background:transparent; border-radius:12px; padding:8px 10px; font:700 13px/1.3 Nunito,sans-serif; cursor:pointer; color:var(--encre); }
  .menu-pages button.on { background:#fff; border-color:var(--filet); }
  .feuille { min-height:420px; background:var(--fond); border:1px solid var(--filet); border-radius:16px; padding:16px; }
  #porte { position:fixed; inset:0; z-index:30; background:#f4f1ea; display:flex; align-items:center; justify-content:center; padding:16px; }
  #porte[hidden] { display:none; }
  #porte form { width:min(420px, 100%); background:#fff; border:1px solid var(--filet); border-radius:20px; padding:28px; display:flex; flex-direction:column; gap:12px; }
  #porte input { border:1px solid var(--filet); border-radius:12px; padding:12px 14px; font:16px Nunito,sans-serif; color:var(--encre); }
  #porte button { background:var(--teal); color:#fff; border:0; border-radius:12px; padding:12px; font:700 16px Nunito,sans-serif; cursor:pointer; }
  #err { color:#9a3412; margin:0; }
  body.ferme header, body.ferme main { display:none; }
  @media (max-width:800px) { .grid2, .grid3, .maquette { grid-template-columns:1fr; } .rail { display:none; } }
</style>
</head>
<body class="ferme">
<div id="porte">
  <form id="forme">
    <h1>Learning App SBO</h1>
    <p>Lecture des cahiers. Le mot de passe ouvre la page.</p>
    <input id="mdp" type="password" autocomplete="current-password" placeholder="Mot de passe" autofocus />
    <button type="submit">Ouvrir</button>
    <p id="err" hidden>Ce mot de passe n'ouvre pas la page.</p>
  </form>
</div>
<header class="barre">
  <p>Lecture hors Cursor · 11 novembre 2026 · à partager avec Chloé. Les cahiers 01, 01bis et 01ter sont arbitrés. Les suivants sont une première lecture.</p>
  <div class="pills" id="haut"></div>
  <div class="pills" id="sous" style="margin-top:8px"></div>
</header>
<main id="vue"></main>
<script>
const HAUT = [
  ["presentation","Présentation"],
  ["decisions","Décisions"],
  ["parcours","01 Parcours"],
  ["items","01bis Items"],
  ["veille","01ter Veille"],
  ["passeport","02 Passeport"],
  ["onboarding","03 Onboarding"],
  ["coaching","04 Coaching"],
  ["badges","05 Badges"],
  ["entreprise","06 Entreprise"],
  ["journal","07 Journal"],
  ["activite","07bis Activité"],
  ["evenements","08 Événements"],
  ["notifications","09 Notifications"],
  ["analytics","10 Analytics"],
  ["backoffice","10bis Back-office"],
  ["projets","11 Projets"],
  ["abonnement","11bis Abonnement"],
  ["chatbot","12 Chatbot"],
  ["cadreia","12bis Cadre IA"],
  ["aide","13 Aide"],
  ["conformite","13bis Conformité"],
  ["consolidation","14 Consolidation"],
  ["hors","Hors lancement"]
];
const SOUS = [["cahier","Cahier des charges"],["journeys","User journeys"],["protocole","Protocole"],["bo","Back-office"],["maquette","Maquette"]];
const etat = { haut:"presentation", sous:"cahier", ongletFil:"tous", noteFil:"", noteListe:"", rang:0, choix:"", issue:"", ongletParcours:"programme", noteParcours:"" };

function rail(actif) {
  const items = ["Tableau de bord","Mes parcours","Bibliothèque","Journal de bord","Coaching","Veille"];
  return `<aside class="rail"><div class="logo"><i style="width:12px;height:12px;background:#55A1B4;left:2px;top:8px"></i><i style="width:8px;height:8px;background:#F8B044;right:2px;top:2px"></i><i style="width:7px;height:7px;background:#007A90;right:4px;bottom:3px"></i></div>${items.map(n => `<span style="background:${n===actif?"#fff":"transparent"}">${n}</span>`).join("")}<div class="qui"><b>Chloé Martin</b><div class="muted">Apprenante</div></div></aside>`;
}

const pages = {
  presentation: () => `<h1>Learning App SBO</h1>
    <p class="muted">Plateforme de formation pour une organisation fondée sur les compétences. Un seul go-live, quand le package est prêt.</p>
    <div class="stats"><div class="stat"><b>18</b>Cahiers fonctionnels au go-live</div><div class="stat"><b>6</b>Rôles</div><div class="stat"><b>22</b>Onglets de cahier</div><div class="stat"><b>4</b>Décisions du 11 novembre</div></div>
    <div class="grid2"><div><h2>Le projet</h2><p>L'apprenant suit des parcours, pioche dans une bibliothèque, lit une veille, tient un passeport de compétences, réserve du coaching et écrit dans son journal. L'entreprise gère ses gens, ses équipes et ses crédits. Le coach suit les personnes qui lui sont assignées.</p><p>Le front est l'application React. Le back-office est WordPress, réservé à Camille. La liste du 16 mai compte 18 cahiers fonctionnels au go-live, plus le 14 qui est un processus. Les cahiers 15 à 20 restent après le lancement.</p><p>Le 01, le 01bis et le 01ter sont arbitrés. Les onglets suivants sont une première lecture des fichiers d'origine. Le 07bis existe comme fichier et n'est pas compté dans les 18.</p></div>
    <div><h2>Comment lire</h2><p>La rangée du haut change de grand morceau. Dans un cahier : cahier des charges, user journeys, protocole, back-office, maquette.</p><p>Le back-office est écrit. Il n'a pas d'écran. La maquette est le prototype des écrans du front.</p><p>Ce document est la source de vérité des cahiers retravaillés. Les fichiers d'origine ne sont pas réécrits.</p></div></div>
    <h2>Les rôles</h2>
    <table><tr><th>Prénom</th><th>Rôle</th><th>Où</th><th>Dans ce document</th></tr>
    <tr><td>Camille Rousseau</td><td>Super-Admin</td><td>Back-office</td><td>Crée le contenu. Tient le référentiel, les plans, les rôles, les modèles et la conformité.</td></tr>
    <tr><td>Inès Morel</td><td>Company Manager</td><td>Front</td><td>Société, comptes, pool de crédits, devis, rapports. Onglets 03, 06 et 11bis.</td></tr>
    <tr><td>Marc Dupont</td><td>Manager d'équipe</td><td>Front</td><td>Équipe, approbations, projets. Onglets 03, 04, 06 et 11.</td></tr>
    <tr><td>Léa Bernard</td><td>Coach</td><td>Front</td><td>Suit, recommande la veille, coache, commente le journal. Pas de back-office.</td></tr>
    <tr><td>Chloé Martin</td><td>Apprenante entreprise</td><td>Front</td><td>Parcours, bibliothèque, veille, passeport, coaching, journal, événements.</td></tr>
    <tr><td>Prénom non fixé</td><td>Apprenant individuel</td><td>Front</td><td>Même lecture que Chloé, sans société. Il choisit un plan, y compris le gratuit.</td></tr></table>
    <p class="muted">Vincent Aubert est l'expert du parcours Notion. Il n'est pas un rôle de la plateforme.</p>
    <h2>Où en est chaque onglet</h2>
    <table><tr><th>Onglet</th><th>Lecture</th><th>Ce qu'il couvre</th></tr>
    <tr><td>01, 01bis, 01ter</td><td>Arbitrés</td><td>Parcours et leçons, dix types, cinq formats de veille.</td></tr>
    <tr><td>02 à 13bis</td><td>Première lecture</td><td>Passeport, comptes, coaching, badges, entreprise, journal, événements, notifications, analytics, back-office, projets, abonnement, chatbot, cadre IA, aide, conformité.</td></tr>
    <tr><td>07bis</td><td>Fichier hors liste</td><td>Journal d'activité et tâches. Absent des 18 cahiers du 16 mai.</td></tr>
    <tr><td>14</td><td>Processus</td><td>Consolidation avant le go-live. Pas un module.</td></tr>
    <tr><td>Hors lancement</td><td>Après le go-live</td><td>15 applications, 16 agent, 17 social, 18 marketplace, 19 outil auteur, 20 synchronisation.</td></tr></table>`,
  decisions: () => `<h2>Décisions du 11 novembre 2026</h2><p class="muted">Elles priment sur les fichiers d'origine quand ceux-ci disent encore le contraire.</p>
    <div class="grid2">
      <div class="card"><h3>1. Dix types, et la leçon à part</h3><p>Le Learning Space compte dix types. La leçon n'en fait pas partie : elle appartient au parcours. Le décompte 6, 9 ou 11 est périmé. Le micro-learning n'est pas un type.</p></div>
      <div class="card"><h3>2. Aide de mission</h3><p>Le panneau Ressources d'aide reste. Camille y attache au moins un item déjà publié. Chloé l'ouvre depuis la mission et y revient. Ce n'est pas un douzième type.</p></div>
      <div class="card"><h3>3. Camille seule crée</h3><p>Seul le Super-Admin crée les parcours et les items, dans le back-office. Léa suit, recommande de la veille et coache. Elle n'a pas de back-office.</p></div>
      <div class="card"><h3>4. Positionnement</h3><p>Ce cahier ne pose que la modale Dreyfus au premier accès à un parcours. Valider ou Passer, pas de croix, une seule fois. L'onboarding à l'inscription est le cahier 3.</p></div>
    </div>
    <div class="card" style="margin-top:12px"><b>Recommandation d'un item.</b> Elle est post-lancement. Le fichier 12bis la marque encore dans le go-live, à la feature 2. Cette décision prime.</div>
    <h2>Carte des catalogues</h2><p>Camille produit les parcours et leurs leçons, les 10 types et la veille. Léa ne fait qu'une recommandation. Les trois chemins arrivent chez Chloé sans se mélanger.</p>`,
};

function blocParcours(sous) {
  if (sous === "cahier") return `<p>Un parcours est une suite d'étapes. Chaque étape aligne des leçons principales, numérotées, et des complémentaires sans numéro. Les complémentaires comptent pour finir l'étape. Ce sont des items du Learning Space. La leçon, elle, reste dans ce cahier.</p>
    <div class="grid3"><div class="card"><h3>Strict</h3><p>La leçon suivante et l'étape suivante restent fermées tant que ce qui précède n'est pas complet.</p></div><div class="card"><h3>Souple</h3><p>L'étape suivante s'ouvre avant que l'étape en cours soit finie.</p></div><div class="card"><h3>Libre</h3><p>Toutes les leçons et toutes les étapes sont ouvertes.</p></div></div>
    <h3>Première entrée</h3><p>Au premier Commencer, une question de niveau apparaît pour chaque compétence. Valider écrit les niveaux. Passer n'écrit rien. Pas de croix. Une seule fois. Sans compétence, pas de modale.</p>
    <h3>Leçon</h3><p>Elle n'est pas un item du Learning Space. Écrans : Engagement, Découvrir, Quiz, Réfléchir, Application, Transfert. Engagement, Découvrir et Réfléchir sont obligatoires. L'application vide n'affiche pas de zone vide. Sept questions au back-office, trois tirées au sort. Trois sur trois ouvrent la réflexion. Découvrir n'a pas de vidéo.</p>
    <h3>Visibilité</h3><p>Liste filtrée par les paliers cochés. Adresse directe d'un autre palier : réserve et changement de plan. Compte gratuit si Camille le marque. Attribution à des personnes nommées, qui ouvrent même hors palier. Portée globale ou limitée à une entreprise. Prérequis visible, le clic explique le manque. Un cycle est refusé.</p>`;
  if (sous === "journeys") return `<h3>Découvrir et se positionner</h3><p>Menu ou lien, liste filtrée, Commencer. S'il y a des compétences : modale, Valider ou Passer, puis la vue, puis la leçon 1. S'il n'y en a pas : ouverture directe.</p><h3>Camille construit</h3><p>Titre, durée, niveau, portée, règle, étapes, leçons, compléments, prérequis. Sans étape ou sans leçon, publication refusée. Ensuite les abonnements.</p><h3>Leçon</h3><p>Engagement, Découvrir, quiz. Moins de 3 sur 3 : nouvelle pioche. Puis Réfléchir, copie possible dans le journal, Application si elle est remplie, Transfert.</p>`;
  if (sous === "protocole") return `<p class="muted">Cas 1 à 3 avec Chloé. Cas 5 et 7 avec Camille. Cas 6 : chaque restriction. Cas 7 : la leçon.</p>
    ${details("1. Liste", ["Bon abonnement : liste, six par page, pas commencé, en cours ou terminé.","Autre palier absent.","Adresse directe : réserve et changement de plan."])}
    ${details("2. Première entrée", ["Autant de questions que de compétences.","Valider écrit niveaux, date et réponses. Passer n'écrit rien et ouvre.","Pas de croix. La modale ne revient pas.","Zéro compétence : pas de modale, avertissement au back-office.","Hors ligne : message de connexion, pas de modale."])}
    ${details("3. Avancer", ["Strict : leçon 2 et étape 2 fermées tant que le précédent n'est pas complet, complémentaires compris.","Souple : étape suivante avant 100 %. Libre : tout ouvert.","Prérequis non tenu : carte visible, clic explicatif.","Marquer comme fait enregistre la personne, l'item et l'heure."])}
    ${details("5. Édition", ["Camille seule. Léa n'a pas le menu.","Publication refusée sans étape ou sans leçon.","Zéro compétence : avertissement, publication possible.","Republier garde la progression. Changer le palier laisse les inscrits dans leur accès."])}
    ${details("6. Restrictions", ["Paliers cochés un par un, même un palier supérieur non coché ne voit pas.","Mauvais palier : absent, adresse = réserve.","Portée entreprise : seulement cette entreprise. L'individuel ne voit pas. Portée globale : il voit, au bon palier.","Compte gratuit seulement si marqué. Le marquage n'enlève rien aux paliers cochés.","Attribution : la personne nommée ouvre même hors palier. Retrait avant démarrage ferme. Après, l'accès et l'avancement restent.","Brouillon et dépublié : adresse fermée. La progression reparaît si Camille republie."])}
    ${details("7. Leçon", ["S'ouvre depuis la présentation. Absente de la bibliothèque.","Publication bloquée si Engagement, Découvrir ou Réfléchir manque, ou si le quiz n'a pas 7 questions.","3 questions tirées au sort, 3 sur 3 pour Réfléchir. Nouvelle pioche après un échec.","Sans Application, pas de zone vide."])}`;
  if (sous === "bo") return `<p>Camille est la seule à voir le menu Parcours. L'écran n'est pas maquetté.</p><table><tr><th>Règle</th><th>Effet</th></tr>
    <tr><td>Champs</td><td>Titre, durée, niveau, image, portée globale ou entreprise, strict, souple ou libre.</td></tr>
    <tr><td>Leçon</td><td>Sept questions, trois montrées. Application facultative. Pas un item de bibliothèque.</td></tr>
    <tr><td>Abonnements</td><td>Paliers cochés, et marquage compte gratuit. Les inscrits gardent l'accès.</td></tr>
    <tr><td>Attribution</td><td>Personnes nommées. Hors palier, hors gratuit, hors portée.</td></tr></table>`;
  return maquetteParcours();
}

function details(titre, lignes) { return `<details open><summary>${titre}</summary><ul>${lignes.map(l => `<li>${l}</li>`).join("")}</ul></details>`; }

function maquetteParcours() {
  const ecran = etat.ecranParcours || "vue";
  const pagesM = [["liste","Liste des parcours"],["modale","Modale de positionnement"],["vue","Présentation du parcours"],["lecon","Leçon"],["reserve","Parcours hors abonnement"]];
  const corps = {
    liste: () => `<div class="coque">${rail("Mes parcours")}<div class="scene"><h1 style="font-size:32px">Mes parcours</h1><p class="muted">Page 1 · six cartes. Trois montrées. Un autre palier n'apparaît pas.</p>${etat.noteListe?`<div class="note">${etat.noteListe}</div>`:""}
      ${[["IA générative et Notion","31 h 30 · Débutant","Pas commencé","Commencer","Première visite : la modale s'ouvre."],["Relier les vues","4 h · Compétent","En cours","Reprendre","Déjà ouvert : pas de modale."],["Le schéma d'équipe","6 h · Performant","Terminé","Voir","Terminé. La présentation s'ouvre."]].map(c => `<div class="carte"><div class="vignette"></div><div style="flex:1"><b>${c[0]}</b><div class="muted">${c[1]} · ${c[2]}</div></div><button class="solid" data-note="${c[4]}">${c[3]}</button></div>`).join("")}</div></div>`,
    modale: () => { const q = ["Choisir le bon objet","Relier une vue à sa base"]; const n = ["Novice","Avancé débutant","Compétent","Performant","Expert"]; return `<div class="coque">${rail("Mes parcours")}<div class="scene"><div class="modale"><div class="voile"><h1>Mes parcours</h1><div class="card">IA générative et Notion</div></div><div class="boite"><div class="muted">Question ${etat.rang+1} sur 2</div><h2>${q[etat.rang]}</h2><p>Où en es-tu ? Pas de croix.</p><div class="niveaux">${n.map(x => `<button data-choix="${x}" class="${etat.choix===x?"on":""}">${x}</button>`).join("")}</div>${etat.issue?`<div class="note">${etat.issue}</div>`:""}<div class="actions"><button class="solid" data-issue="Les niveaux, la date et les réponses sont écrits sur la fiche.">Valider</button><button data-issue="Rien n'est enregistré. Le parcours s'ouvre quand même.">Passer</button>${etat.rang<1?`<button data-suite="1">Question suivante</button>`:""}</div></div></div></div></div>`; },
    vue: () => `<div class="coque">${rail("Mes parcours")}<div class="scene"><div class="hero"><div class="muted" style="color:#d7eef3">Outils</div><h1 style="color:#fff">IA générative et Notion</h1><p>Structurer l'espace de travail, puis y faire travailler l'IA.</p><div style="display:flex;gap:14px;font-weight:700"><span>32 leçons</span><span>31 h 30</span><span>Débutant</span></div><button class="solid" data-note-p="La leçon s'ouvre sur sa page. Elle n'est pas un item du Learning Space." style="margin-top:12px">Commencer la leçon</button></div>
      <div class="onglets">${["programme","Programme","ressources","Ressources","badge","Open badge"].reduce((a,x,i,arr)=> i%2? a : a.concat([[x, arr[i+1]]]), []).map(([id,label]) => `<button data-op="${id}" class="${etat.ongletParcours===id?"on":""}">${label}</button>`).join("")}</div>
      ${etat.noteParcours?`<div class="note">${etat.noteParcours}</div>`:""}

      <aside class="card" style="margin-top:12px"><b>Coaching</b><p class="muted">Léa Bernard suit ce parcours. Elle ne le crée pas.</p></aside></div></div>`,

    reserve: () => `<div class="coque">${rail("Mes parcours")}<div class="scene"><div class="card"><h2>Pilotage avancé</h2><p>Ce parcours n'est pas dans ton abonnement. Il n'apparaît pas dans la liste.</p><button class="solid">Changer de plan</button></div></div></div>`
  };
  return `<p class="muted">Chloé · cinq pages. Le verrou et les règles sont des états de la présentation.</p><div class="pills" style="margin-bottom:12px">${pagesM.map(([id,label]) => `<button class="pill ${ecran===id?"on":""}" data-ep="${id}">${label}</button>`).join("")}</div>${corps[ecran]()}`;
}

function blocItems(sous) {
  if (sous==="cahier") return `<p>Bibliothèque de dix types, à la demande. La leçon est dans le cahier 01. Un item peut être un complémentaire d'étape. La veille est le 01ter.</p>
    <table><tr><th>Type</th><th>Ce qui distingue</th></tr>
    <tr><td>Astuce</td><td>Doublon signalé</td></tr><tr><td>Flashcard</td><td>Au moins deux réponses, une seule bonne</td></tr><tr><td>Ressource</td><td>Lien testé</td></tr><tr><td>Guide</td><td>Au moins deux étapes</td></tr>
    <tr><td>Vidéo de conception</td><td>Durée et vignette reprises de l'adresse</td></tr><tr><td>Vidéo de geste</td><td>Même fiche, plus la description du geste</td></tr>
    <tr><td>Masterclass d'item</td><td>Expert, date, lien. Distincte du cahier 8</td></tr><tr><td>Devoir</td><td>Échéance, critères, rappel</td></tr>
    <tr><td>Mission</td><td>Livrables. Au moins une ressource déjà publiée</td></tr><tr><td>Open badge</td><td>Ancien nom : projet final. Phases et grille</td></tr></table>
    <h3>Visibilité</h3><p>Paliers, compte gratuit, attribution individuelle. Pas de portée entreprise. Un item ouvert depuis un parcours déjà accessible n'est pas refermé par le filtre. Prérequis : carte visible, clic explicatif.</p>`;
  if (sous==="journeys") return `<p>Même lecteur depuis la bibliothèque, le parcours ou une adresse. Le bandeau nomme la source. Le retour garde filtre et position. Camille choisit un des dix types, prévisualise, publie. La mission attache des items déjà publiés. Chloé les ouvre et revient à la mission.</p>`;
  if (sous==="protocole") return `<p class="muted">Retour avec Chloé. Éditeurs et mission avec Camille. Cas 10 : restrictions. La leçon se teste dans le 01.</p>
    ${details("4. Retour", ["Le bandeau nomme la source. Le retour retrouve filtre et position.","Adresse collée : retour à l'accueil de la bibliothèque."])}
    ${details("6. Dix éditeurs", ["Léa ne voit pas les formulaires.","Astuce : doublon signalé. Flashcard : une seule bonne réponse. Ressource : lien testé. Guide : deux étapes minimum.","Vidéos : durée et vignette. Masterclass d'item distincte du cahier 8. Devoir : échéance.","Mission : au moins une ressource publiée. Open badge : phases et grille."])}
    ${details("9. Mission", ["Publication refusée à vide, en doublon, ou si l'item est archivé.","Chloé ouvre l'item et revient à la mission."])}
    ${details("10. Restrictions", ["Paliers un par un. Compte gratuit si marqué. Attribution nommée.","Depuis un parcours déjà ouvert, l'item s'ouvre.","Pas de portée entreprise. Brouillon et archivé : adresse fermée. La lecture déjà faite reste.","Prérequis non tenu : carte marquée, le clic explique."])}`;
  if (sous==="bo") return `<p>Camille seule. Pas d'écran dessiné.</p><p>Création des dix types, paliers, compte gratuit, attribution, mission, Open badge, archivage sans effacer les lectures.</p>`;
  const pagesM = ["Bibliothèque","Item hors abonnement","Astuce","Flashcard","Ressource","Guide","Vidéo de conception","Vidéo de geste","Masterclass d'item","Devoir","Mission","Open badge"];
  return `<p class="muted">Douze pages, une par item. Pas encore dessinées. Le bandeau de retour est le même sur chaque lecteur.</p><ul>${pagesM.map(p => `<li>${p}</li>`).join("")}</ul>`;
}

function blocVeille(sous) {
  if (sous==="cahier") return `<p>Fil à part des dix types et des leçons. Camille publie et approuve. Léa recommande depuis le front.</p>
    <h3>Lecture</h3><p>Le plus récent d'abord. Onglets : Tous, Dossier, Mag du mois, Tutoriel, Actualité, Article sourcé. Marquer lu et sauvegarder sont deux gestes. Le retour retrouve l'onglet.</p>
    <h3>Les cinq formats</h3><table><tr><th>Format</th><th>Ce qui distingue</th></tr>
    <tr><td>Dossier</td><td>Éditorial, articles dans l'ordre de Camille, source de la rédaction.</td></tr>
    <tr><td>Mag du mois</td><td>Même lecture, rythme mensuel.</td></tr>
    <tr><td>Tutoriel vidéo</td><td>Lecteur. Pas une vidéo du Learning Space.</td></tr>
    <tr><td>Actualité</td><td>Même lecture, rythme de la semaine.</td></tr>
    <tr><td>Article sourcé</td><td>Hors du fil tant que Camille n'a pas approuvé. Un rejet le garde, avec le motif.</td></tr></table>
    <h3>Visibilité</h3><p>Mêmes restrictions qu'un item : paliers, compte gratuit, attribution. Pas de portée entreprise.</p>`;
  if (sous==="journeys") return `<p>La rédaction entre dans le fil. L'article sourcé passe par la file de Camille. Chloé filtre par onglet, lit, marque lu ou sauvegarde. Léa envoie une phrase et une date facultative. Chloé la retrouve sur le contenu.</p>`;
  if (sous==="protocole") return `${details("1. Fil", ["Pas d'item du Learning Space, pas de leçon.","Onglets de format. Tous montre tout. Un onglet ne montre que son format.","Lien externe mort : message, le texte reste lisible.","Le retour retrouve l'onglet."])}
    ${details("2. Approbation", ["Camille publie dossier, mag, tutoriel, actualité. Léa ne voit pas ces écrans.","Article sourcé : approuver, rejeter avec motif, ou retaguer. Le rejeté est archivé.","Risque de droits : avertissement. Camille peut approuver si la source est nommée."])}
    ${details("3. Recommandation", ["Léa, depuis le front : personnes, phrase, date facultative.","Sans personne ou sans phrase, envoi refusé.","La trace dit lu ou ignoré."])}
    ${details("4. Restrictions", ["Paliers, compte gratuit, attribution, comme un item.","Pas de portée entreprise.","Brouillon, non approuvé, rejeté : absents. L'adresse n'ouvre pas."])}`;
  if (sous==="bo") return `<p>Camille seule pour la rédaction et la file. Léa recommande dans le front.</p>`;
  return maquetteVeille();
}

function maquetteVeille() {
  const cartes = [
    ["dossier","Dossier","Briefs qui échouent","Rédaction · 14 min"],
    ["mag","Mag du mois","Mag de novembre","Rédaction · 11 min"],
    ["tutoriel","Tutoriel","Filtrer une vue sans copier la base","Rédaction · 7 min"],
    ["actu","Actualité","La propriété « personne » change","Rédaction · 4 min"],
    ["source","Article sourcé","Un schéma d'information tient en une page","Approuvé · 9 min"]
  ];
  const onglets = [["tous","Tous"],["dossier","Dossier"],["mag","Mag du mois"],["tutoriel","Tutoriel"],["actu","Actualité"],["source","Article sourcé"]];
  const visibles = etat.ongletFil==="tous" ? cartes : cartes.filter(c => c[0]===etat.ongletFil);
  const fil = `<div class="coque">${rail("Veille")}<div class="scene"><h1>Veille</h1><p class="muted">Le plus récent d'abord. Un item du Learning Space n'apparaît pas.</p>
    <div class="onglets">${onglets.map(([id,label]) => `<button data-of="${id}" class="${etat.ongletFil===id?"on":""}">${label}</button>`).join("")}</div>
    ${etat.noteFil?`<div class="note">${etat.noteFil}</div>`:""}
    ${visibles.map(c => `<button class="carte" data-of-note="${c[1]} · la lecture s'ouvre, le retour revient sur cet onglet."><div class="vignette"></div><div><div style="color:var(--teal);font-weight:700;font-size:12px">${c[1]}</div><b>${c[2]}</b><div class="muted">${c[3]}</div></div></button>`).join("")}
    </div></div>`;
  const ecran = etat.ecranVeille || "fil";
  const menu = [["fil","Fil"],["dossier","Dossier"],["mag","Mag du mois"],["tutoriel","Tutoriel vidéo"],["actu","Actualité"],["source","Article sourcé"],["reco","Recommandation de Léa"],["reserve","Contenu hors abonnement"]];
  const autre = ecran==="fil" ? fil : `<div class="card"><h3>${menu.find(m => m[0]===ecran)[1]}</h3><p>Page listée, pas encore dessinée. Le fil, lui, est cliquable.</p></div>`;
  return `<div class="pills" style="margin-bottom:12px">${menu.map(([id,label]) => `<button class="pill ${ecran===id?"on":""}" data-ev="${id}">${label}</button>`).join("")}</div>${autre}`;
}

2","Léa","Corrige un travail : mission, jalon, projet ou devoir."],["3","Léa","Tient son agenda, ses sessions et ses messages."],["4","Camille","Assigne un coach à une personne."],["5","Marc","Approuve ou refuse une réservation si la règle l'exige."],["6","Chloé","Annule dans la fenêtre de 72 heures et retrouve les crédits."],["7","Léa","Connecte Google ou Outlook."],["8","Système","Envoie les invitations une fois la session créée."]],"protocole":[["Sans coach","Chloé ne peut pas réserver. Le message dit qu'aucun coach n'est assigné."],["Créneau pris","Le créneau disparaît. Un deuxième essai ne crée pas une deuxième session."],["Crédits","Solde insuffisant : la réservation n'est pas confirmée, l'achat du 03 peut s'ouvrir."],["Pool","La demande de Chloé attend Marc. Un refus ne débite pas."],["72 heures","L'annulation dans la fenêtre recrédite. Après, elle ne recrédite pas."],["Correction","Un travail approuvé sort de la file. Un travail à réviser revient à Chloé avec le commentaire."],["Calendrier","Sans connexion, Léa ne publie pas de créneaux issus de son agenda."]],"bo":[["Assignation","Camille relie un coach et une personne."],["Tarifs","Coût en crédits d'une session."],["Activité","Suivi des sessions, sans devenir le calendrier de Léa."]],"pages":[{"id":"hub","label":"Accueil coaching","qui":"Chloé"},{"id":"reserver","label":"Réserver une session","qui":"Chloé"},{"id":"session","label":"Détail d'une session","qui":"Chloé"},{"id":"annulation","label":"Annulation","qui":"Chloé"},{"id":"corrections","label":"Travaux à corriger","qui":"Chloé"},{"id":"correction","label":"Détail d'une correction","qui":"Chloé"},{"id":"profil-coach","label":"Profil du coach","qui":"Chloé"},{"id":"messages","label":"Messages","qui":"Chloé ou Léa"},{"id":"accueil-lea","label":"Accueil de Léa","qui":"Léa"},{"id":"agenda","label":"Calendrier","qui":"Léa"},{"id":"file","label":"File de correction","qui":"Léa"},{"id":"revue","label":"Revue d'un travail","qui":"Léa"},{"id":"portefeuille","label":"Personnes assignées","qui":"Léa"},{"id":"approbations","label":"Approbations","qui":"Marc"}],"sansMaquette":""},{"id":"badges","titre":"05 Badges, XP et séries","fichier":"Première lecture de 05_Gamification_Badges.md. Pas encore arbitrée.","objectif":"Trois familles de badges : plateforme, compétences, Open badge. L'XP est visible. Une série compte les jours consécutifs avec au moins une activité. Il n'y a pas de classement.","point":"Le parcours 4 du fichier dit encore « après le projet final ». Le nom retenu le 11 novembre est Open badge. L'Open badge du parcours, dans le 01, et l'Open badge réclamé ici avec des crédits sont le même objet : la page de réclamation reste à recouper avec l'onglet Open badge du parcours.","regles":[["Plateforme","Camille définit l'icône, le texte, la rareté et le déclencheur. Séries de 3, 7 et 30 jours, jalons de parcours, régularité du journal, sessions de coaching."],["Séries","Au moins une activité dans la journée. Remise à zéro à minuit UTC. Les seuils sont réglables par Camille."],["Compétences","Cinq badges par compétence, un par niveau Dreyfus, couleurs fixes du novice au dernier niveau."],["Open badge","Certificat hébergé par la plateforme, après validation. Téléchargement, vérification, partage, QR. La réclamation peut coûter des crédits."],["Solde insuffisant","La réclamation n'aboutit pas. L'achat de crédits du 03 s'ouvre."],["Atrophie","Une inactivité longue grise le badge. Le fichier décrit le cas. La durée exacte reste celle du fichier, à confirmer."],["Léa","Elle voit les séries, les badges et l'XP des personnes assignées. Elle ne crée pas les badges."]],"hors":[["Classement","Hors scope, déjà écrit dans l'inventaire du front."],["Atrophie prédictive","Feature 8 du 12bis, après le lancement. Le grisissement décrit ici est le comportement du badge, pas cette feature."]],"journeys":[["1","Chloé","Découvre et obtient un premier badge."],["2","Chloé","Maintient une série quotidienne."],["3","Léa","Surveille l'engagement des personnes assignées."],["4","Chloé","Reçoit et partage un Open badge."],["5","Chloé","Voit un badge grisé après inactivité."],["6","Chloé","Veut réclamer un badge sans assez de crédits."]],"protocole":[["Déclencheur","L'action prévue donne le badge une fois. La même action ne le donne pas deux fois."],["Série","Un jour sans activité remet le compteur à zéro. Le record reste visible."],["Crédits","Sans solde, pas d'Open badge. Après achat, la réclamation peut reprendre."],["Partage","Le lien de vérification s'ouvre sans compte sur la plateforme."],["Atrophie","Le badge obtenu reste dans l'historique. L'affichage montre l'inactivité."],["Classement","Aucune page ne compare les personnes entre elles."]],"bo":[["Badges plateforme","Définition, déclencheur, rareté, image."],["XP","Budget par type d'activité. Le détail des sources est le 02."],["Open badge","Émetteur, modèle, coût en crédits."]],"pages":[{"id":"hub","label":"Tableau badges et XP","qui":"Chloé"},{"id":"detail","label":"Détail d'un badge","qui":"Chloé"},{"id":"serie","label":"Détail d'une série","qui":"Chloé"},{"id":"galerie","label":"Galerie du profil","qui":"Chloé"},{"id":"open","label":"Open badges du profil","qui":"Chloé"},{"id":"niveaux","label":"Badges de compétences","qui":"Chloé"},{"id":"lea","label":"Engagement, vue de Léa","qui":"Léa"}],"sansMaquette":""},{"id":"entreprise","titre":"06 Espace entreprise","fichier":"Première lecture de 06_Enterprise_FO_Space.md. Pas encore arbitrée.","objectif":"Portail du front pour Inès et Marc. Inès ne voit que sa société. Marc ne voit que son équipe. Léa voit l'onboarding des personnes qui lui sont assignées. Camille règle les rôles, les webhooks et les sociétés dans le back-office.","point":"Le fichier dit encore « Super-Admin (Pierre) ». Dans ce document, ce rôle est Camille. La réservation de coaching avec le pool est le parcours 8 de ce fichier, et l'écran de réservation reste celui du 04.","regles":[["Périmètre","Inès voit les indicateurs, le budget, les projets et les alertes de sa société. Aucune autre société."],["Équipe","Marc voit la progression, les projets et les jalons de son équipe."],["Alertes","Inès ou Marc règle les seuils d'inactivité, de projet et de budget, et les destine à des personnes."],["Exports","Rapport des personnes, des projets, des compétences ou des budgets, en CSV ou PDF, sur une période."],["Crédits","Inès voit le pool, demande un devis, suit la signature et la consommation par service et par personne."],["Onboarding","Inès voit qui a fini. Léa voit la même liste, limitée à ses personnes."],["Vues","Inès ou Marc compose une vue de métriques et l'enregistre."],["API","Le fichier prévoit une documentation d'API pour un développeur. Ce n'est pas un écran d'apprenant."]],"hors":[["Rôles personnalisés côté front","L'inventaire du front les marque hors scope. Le parcours 3 reste un besoin de back-office pour Camille."]],"journeys":[["1","Inès","Ouvre le portail et crée un rapport."],["2","Marc","Consulte son équipe et une alerte d'inactivité."],["3","Camille","Crée un rôle et ses permissions, dans le back-office."],["4","Camille","Configure un webhook et teste l'envoi."],["7","Inès","Demande un achat de crédits par devis."],["8","Chloé","Réserve un coaching payé par le pool. L'écran est le 04."]],"protocole":[["Société","Inès ne trouve pas une personne d'une autre société, ni par recherche ni par URL."],["Équipe","Marc ne voit pas une autre équipe de la même société."],["Export","Le fichier produit couvre la période demandée et seulement le périmètre du rôle."],["Alerte","Sous le seuil, la personne prévue est notifiée. Au-dessus, rien ne part."],["Devis","Le lien de signature est à usage unique. Un devis signé apparaît dans le pool."],["Webhook","Un échec de test reste visible. Camille peut renvoyer."]],"bo":[["Sociétés","Fiche, isolation, données système."],["Rôles","Création et permissions. Camille seule."],["Webhooks","URL, secret, essai d'envoi."],["Alertes","Types disponibles et historique."]],"pages":[{"id":"portail","label":"Portail société","qui":"Inès"},{"id":"equipe","label":"Tableau d'équipe","qui":"Marc"},{"id":"alertes","label":"Réglage des alertes","qui":"Inès ou Marc"},{"id":"export","label":"Export","qui":"Inès ou Marc"},{"id":"onboarding","label":"Onboarding de la société","qui":"Inès"},{"id":"suivi","label":"Onboarding des personnes assignées","qui":"Léa"},{"id":"journal","label":"Indicateurs du journal","qui":"Marc ou Léa"},{"id":"pool","label":"Pool de crédits","qui":"Inès"},{"id":"conso","label":"Consommation","qui":"Inès"},{"id":"vues","label":"Vues enregistrées","qui":"Inès ou Marc"},{"id":"api","label":"Documentation API","qui":"Développeur"}],"sansMaquette":""},{"id":"journal","titre":"07 Journal de bord","fichier":"Première lecture de 07_Journal_de_Bord_Reflexif.md. Pas encore arbitrée.","objectif":"Journal personnel. Chloé écrit, garde un brouillon, publie, retrouve et modifie. La réflexion d'une leçon peut y être copiée : la leçon reste dans le 01. Léa commente seulement si le partage est activé.","point":"Le partage est global, pas entrée par entrée : un interrupteur pour Léa, un pour le manager. Le fichier autorise le manager à lire quand l'interrupteur est ouvert. Marc est ce manager.","regles":[["Entrée","Titre, texte, humeur sur cinq niveaux, brouillon ou publication."],["Questions","Trois questions guidées selon le contexte : item, coaching, masterclass, classe, événement. Camille les écrit dans le back-office."],["Leçon","La copie depuis la réflexion de la leçon crée une entrée ici. Le 01 garde la leçon."],["Recherche","Texte, période, humeur."],["Partage","Fermé par défaut. Ouvert, Léa voit les entrées des personnes assignées. Marc voit celles de son équipe si son interrupteur est ouvert."],["Commentaire","Léa commente. Chloé répond. Le fil reste sur l'entrée."],["Export","Chloé exporte ses entrées."]],"hors":[["Analyse de sentiment par IA","Le 12bis la place après le lancement."]],"journeys":[["1","Chloé","Crée une entrée."],["2","Chloé","Relit et modifie une entrée."],["3","Léa","Lit une entrée partagée et commente."],["4","Chloé","Active le partage avec Léa."]],"protocole":[["Brouillon","Un brouillon n'apparaît ni chez Léa ni chez Marc."],["Partage fermé","Léa ne voit pas l'entrée, même assignée."],["Partage ouvert","Léa voit les entrées publiées de ses personnes. Elle ne voit pas une personne qui ne lui est pas assignée."],["Manager","Marc ne lit le journal que si l'interrupteur manager est ouvert, et seulement son équipe."],["Suppression","Une entrée supprimée disparaît du fil de Léa."],["Copie de leçon","La copie ajoute une entrée. La leçon du parcours ne change pas de cahier."]],"bo":[["Questions guidées","Par type de contexte. Camille les rédige. Le front les pose, il ne les invente pas."]],"pages":[{"id":"liste","label":"Journal","qui":"Chloé"},{"id":"nouvelle","label":"Nouvelle entrée","qui":"Chloé"},{"id":"detail","label":"Détail d'une entrée","qui":"Chloé"},{"id":"recherche","label":"Recherche","qui":"Chloé"},{"id":"supervises","label":"Entrées partagées","qui":"Léa"},{"id":"commentaire","label":"Lecture et commentaire","qui":"Léa"}],"sansMaquette":""},{"id":"activite","titre":"07bis Journal d'activité et tâches","fichier":"Première lecture de 07bis_Journal_Activité_360_Tasks_Recommandations.md. Le fichier existe. La liste du 16 mai ne le compte pas dans les 18.","objectif":"Le fichier veut un journal unique où les tâches de travail, les formations et la réflexion se répondent. Chloé voit une tâche, un écart de compétence, une suite de formations, puis dit si la formation l'a aidée.","point":"Les recommandations de formation par IA sont au cœur de ce fichier. La décision du 11 novembre sort la recommandation d'un item du go-live. Tant que ce point n'est pas tranché, ce cahier ne peut pas être compté dans le package. Il reste visible pour que tu décides s'il entre, s'il attend, ou s'il se réduit aux tâches sans IA.","regles":[["Tâches","Les siennes et celles qu'on lui assigne. Statut, échéance, priorité. Sources : projets, saisie manuelle. Le fichier parle aussi d'une API externe, sans l'intégration Jira ou Asana."],["Écart","Le fichier fait analyser la tâche par l'IA pour nommer les compétences manquantes."],["Suite proposée","Formations ordonnées par urgence, durée et façon d'apprendre. Même famille que la recommandation d'item écartée le 11 novembre."],["Timeline","Tâches, entrées du 07, activités et commentaires de Léa dans une seule chronologie."],["Impact","Tâche terminée : Chloé note ce que la formation a changé. Le fichier en fait une entrée de journal et une preuve de compétence."],["Léa","Elle crée une tâche pour une personne assignée et commente l'exécution."]],"hors":[["Tableaux d'équipe","Le fichier les diffère."],["Tâches partagées","Le fichier les diffère."],["Jira, Asana, Monday","Le fichier les diffère."],["Tâches inventées par l'IA","Le fichier les diffère."]],"journeys":[["1","Chloé","Voit une tâche, la formation proposée, l'exécute, puis dit si cela l'a aidée."],["2","Léa","Crée une tâche et suit le chemin d'apprentissage."],["3","Marc","Le fichier lui donne une vue d'équipe, puis la marque hors de cette version."]],"protocole":[["Sans IA","Si la recommandation reste hors go-live, la tâche et le journal doivent tenir sans proposition de formation."],["Tâche faite","Le retour d'impact crée une entrée dans le 07. La tâche ne reste pas ouverte."],["Périmètre","Léa ne crée pas une tâche pour une personne qui ne lui est pas assignée."]],"bo":[["Types de tâches","Camille relie un type de tâche à des compétences. Pas une génération de contenu."]],"pages":[{"id":"hub","label":"Journal 360","qui":"Chloé"},{"id":"creation","label":"Créer une tâche","qui":"Chloé ou Léa"},{"id":"detail","label":"Tâche et suite proposée","qui":"Chloé"},{"id":"timeline","label":"Chronologie unique","qui":"Chloé"},{"id":"impact","label":"Retour d'impact","qui":"Chloé"},{"id":"jauge","label":"Compétences pour la tâche","qui":"Chloé"}],"sansMaquette":""},{"id":"evenements","titre":"08 Masterclass, ateliers et événements","fichier":"Première lecture de 08_Masterclass_Atelier_Pratique_Evenements.md. Pas encore arbitrée.","objectif":"Trois familles. La masterclass premium est un live réservé à un abonnement, à ne pas confondre avec l'item Masterclass du 01bis. L'atelier est une session d'entreprise, payée en crédits. L'événement est public ou privé.","point":"L'inventaire annonce 18 pages et en liste 16. Les deux manquantes ne sont pas inventées ici. Le fichier parle d'un expert interne qui anime : ce n'est pas encore un prénom du document.","regles":[["Masterclass","Inscrite dans l'abonnement, zéro crédit. Fenêtre d'inscription de J-30 au jour J. 90 minutes. Direct, puis replay, supports et enquête."],["Atelier","Réservé à la société. Le fichier indique 3 crédits, une capacité, une liste d'attente, et un remboursement jusqu'à 7 jours. Présentiel ou distanciel. Marc valide si la règle l'exige."],["Événement","Public ou privé à une société. Capacité souple. Lieu ou visio. Supports et enquête ensuite."],["Calendrier","Chloé voit ses inscriptions, avec la date limite de remboursement pour un atelier."],["Création","Camille ouvre une masterclass, un atelier lié à un devis, ou un événement."]],"hors":[["Item Masterclass","C'est une page du 01bis. Ce cahier ne la redessine pas."]],"journeys":[["1","Abonné premium","Découvre une masterclass et s'inscrit."],["2","Abonné premium","Suit le direct, puis le replay."],["3","Expert interne","Anime le direct. Prénom non fixé."],["4","Chloé","S'inscrit à un atelier de sa société et y participe."],["5","Camille","Ajoute un atelier via un devis et suit les inscriptions."],["6","Public","Découvre un événement public et s'inscrit."],["9","Chloé","S'inscrit à un atelier au coût de 3 crédits."]],"protocole":[["Mauvais abonnement","La masterclass premium est absente, et l'adresse directe explique la réserve. Même famille que le 01."],["Autre société","Chloé ne voit pas l'atelier d'une autre société, ni par la liste ni par l'adresse."],["Complet","Le bouton devient liste d'attente. La position est dite. Une place libérée prévient la personne."],["Crédits","Sans solde et sans accord de Marc quand il est requis, l'inscription ne part pas."],["7 jours","L'annulation dans le délai recrédite. Après, elle ne recrédite pas."],["Replay","Avant la fin du direct, le replay n'est pas proposé. Après, il l'est pour les inscrits."]],"bo":[["Masterclass","Expert, date, fenêtre, supports, replay."],["Atelier","Société, coût, capacité, lieu ou visio, devis."],["Événement","Public ou société, capacité, lieu ou visio."],["Inscriptions","Liste, attente, présences."]],"pages":[{"id":"liste-mc","label":"Liste des masterclass","qui":"Abonné premium"},{"id":"mc-avant","label":"Masterclass avant le direct","qui":"Abonné premium"},{"id":"mc-direct","label":"Masterclass en direct","qui":"Abonné premium"},{"id":"mc-apres","label":"Masterclass après le direct","qui":"Abonné premium"},{"id":"mc-enquete","label":"Enquête masterclass","qui":"Abonné premium"},{"id":"liste-at","label":"Liste des ateliers","qui":"Chloé"},{"id":"at-avant","label":"Atelier avant la session","qui":"Chloé"},{"id":"at-distance","label":"Atelier à distance","qui":"Chloé"},{"id":"at-lieu","label":"Atelier sur place","qui":"Chloé"},{"id":"at-apres","label":"Atelier après la session","qui":"Chloé"},{"id":"attente","label":"Liste d'attente","qui":"Chloé"},{"id":"calendrier","label":"Calendrier des inscriptions","qui":"Chloé"},{"id":"liste-ev","label":"Liste des événements","qui":"Public ou Chloé"},{"id":"ev-avant","label":"Événement avant","qui":"Participant"},{"id":"ev-direct","label":"Événement en direct","qui":"Participant"},{"id":"ev-apres","label":"Événement après","qui":"Participant"}],"sansMaquette":""},{"id":"notifications","titre":"09 Notifications","fichier":"Première lecture de 09_Notifications_Management.md. Pas encore arbitrée.","objectif":"Les autres cahiers déclenchent un événement. Ce cahier le transforme en message, dans l'application et par email. Chloé choisit ce qu'elle reçoit. Camille tient les modèles, la lettre hebdomadaire et les rebonds.","point":"Le fichier met aussi WhatsApp dans le go-live, avec des modèles approuvés. Les notifications push des téléphones sont prêtes dans le fichier et réservées aux applications natives, donc après le lancement. WhatsApp reste à confirmer.","regles":[["Déclencheur","Chaque cahier émet un événement. La file part de là. Action Scheduler, déjà retenu pour la plateforme."],["Canaux du fichier","Email via Brevo, message dans l'application, et WhatsApp si tu le confirmes. Un même événement peut partir sur plusieurs canaux, avec un texte adapté à la longueur."],["Modèles","Camille écrit les variantes et les champs dynamiques."],["Centre","La cloche montre les non lues. La page garde l'historique, l'archivage et les catégories : apprentissage, veille, coaching, parcours, badges, onboarding."],["Préférences","Chloé coupe une catégorie ou un canal. L'essentiel du compte, comme la vérification d'email, continue de partir."],["Lettre","Hebdomadaire. Camille règle l'horaire. Le contenu recommandé par IA est la feature 5 du 12bis, à arbitrer à part."],["Léa","Rapport hebdomadaire des personnes assignées."],["Rebonds","Camille voit les emails qui ne partent pas et peut relancer."]],"hors":[["Push iOS et Android","Avec les cahiers 15, après le lancement."],["Slack","Le fichier le réserve à plus tard."]],"journeys":[["1","Chloé","Reçoit une notification liée à une action."],["2","Chloé","Reçoit la lettre hebdomadaire."],["3","Camille","Écrit les modèles par canal."],["4","Léa","Reçoit son rapport hebdomadaire."],["5","Chloé","Se retire d'un email."],["6","Camille","Règle l'envoi de la lettre."],["7","Chloé","Règle ses préférences."],["8","Camille","Suit les rebonds."]],"protocole":[["Préférence coupée","La catégorie tue l'email. Le message essentiel de compte part encore."],["Déjà lu","Ouvrir le message retire le compteur. L'archivage le sort de la boîte sans l'effacer de l'historique."],["Rebond","L'adresse en échec apparaît chez Camille. Les envois suivants ne restent pas silencieux."],["Désinscription","Le lien de l'email rejoint la préférence. Un nouvel envoi de cette catégorie ne part pas."]],"bo":[["Modèles","Un texte par canal, champs dynamiques, longueur maximale."],["Planification","Lettre et rapports."],["Rebonds","Liste, cause, relance."]],"pages":[{"id":"cloche","label":"Cloche","qui":"Chloé"},{"id":"boite","label":"Boîte des notifications","qui":"Chloé"},{"id":"prefs","label":"Préférences","qui":"Chloé"}],"sansMaquette":""},{"id":"analytics","titre":"10 Analytics","fichier":"Première lecture de 10_Analytics_Tracking_System.md. Pas encore arbitrée.","objectif":"Capturer les faits d'apprentissage des autres cahiers, puis les montrer selon le rôle. Chloé voit sa progression. Léa voit qui décroche parmi ses personnes. Camille voit la plateforme, la qualité des contenus et l'activité.","point":"Le tableau de bord apprenant du fichier reprend le radar, l'XP et les badges. Ce sont déjà les pages du 02 et du 05. Avant de dessiner, il faudra dire si c'est le même écran ou un quatrième tableau de bord.","regles":[["Faits","Les cahiers 01 à 09 émettent des événements. Les critiques sont écrits tout de suite. Le reste suit la file."],["Droits","Chaque rôle ne voit que son périmètre. Inès sa société, Marc son équipe, Léa ses personnes, Chloé elle-même."],["Agrégats","Instantanés quotidiens, tableaux horaires, progression de la personne plus fraîche."],["Qualité","Camille voit les contenus qui bloquent et les retours. Le fichier signale le pire décile."],["Journal","Création, publication, commentaire et partage du 07 sont des faits, pas le texte de l'entrée."]],"hors":[["Temps réel généralisé","Le fichier le réserve. La progression de la personne peut être plus fraîche que les tableaux d'équipe."]],"journeys":[["1","Camille","Lit la performance de la plateforme."],["2","Camille","Repère un contenu qui bloque et les retours."],["3","Léa","Repère une personne en difficulté parmi celles qui lui sont assignées."],["4","Camille","Lit les indicateurs d'activité et la tendance."]],"protocole":[["Périmètre","Léa ne voit pas l'activité d'une personne non assignée."],["Société","Inès ne voit pas les chiffres d'une autre société. Cet écran d'Inès est le 06. Ici, la donnée est la source."],["Journal","Le fait de publication part. Le texte de l'entrée ne part pas dans un tableau."],["Doublon d'écran","Radar, XP et badges ne deviennent pas une nouvelle page tant que le recoupement avec 02 et 05 n'est pas fait."]],"bo":[["Plateforme","Volume, activité, tendance."],["Qualité","Contenus en difficulté, retours, alerte."],["Activité","Indicateurs que Camille suit, distincts des vues de Léa sur le front."]],"pages":[{"id":"perso","label":"Progression personnelle","qui":"Chloé"},{"id":"competence","label":"Détail d'une compétence","qui":"Chloé"},{"id":"mur","label":"Réalisations","qui":"Chloé"},{"id":"equipe","label":"Personnes suivies","qui":"Léa"},{"id":"fiche","label":"Activité d'une personne","qui":"Léa"}],"sansMaquette":""},{"id":"backoffice","titre":"10bis Organisation du back-office","fichier":"Première lecture de 10bis_Back_Office_Organization_UX_Design.md. Pas encore arbitrée.","objectif":"La coquille WordPress de Camille : navigation, tableaux, création des contenus, rôles, recherche, alertes. Les besoins métier de chaque contenu restent dans leur cahier. Ici, c'est la façon dont le back-office se tient.","point":"Le fichier ouvre ce back-office à un gestionnaire de contenu et à un coach. La décision du 11 novembre le réserve à Camille. Léa n'y entre pas. Il n'y a pas de deuxième prénom pour un gestionnaire de contenu.","regles":[["Coquille","En-tête, navigation, zone de travail. Bureau seulement, comme l'écrit le fichier."],["Contenus","Parcours, items, veille, masterclass et événements : brouillon, publié, archivé. Filtres, recherche, tri, pages, actions groupées."],["Personnes","Comptes, crédits, rôles, sociétés. Le métier des crédits est le 03, celui des plans le 11bis."],["Rôles","Camille les règle. Le nettoyage des rôles créés par WooCommerce est dans le fichier."],["Impersonation","Camille ouvre le front comme une personne, pour voir ce qu'elle voit. Le geste est tracé."],["Recherche","Personnes, contenus, parcours."],["Réglages","Référentiel, badges, marque, notifications, intégrations. Chaque sujet renvoie à son cahier."]],"hors":[["Coach dans le back-office","Écarté le 11 novembre."],["Nettoyage WooCommerce","Le fichier le place en maintenance après le lancement. Le parcours 7 reste écrit là."]],"journeys":[["1","Camille","Ouvre le tableau de bord et les indicateurs."],["2","Camille","Crée et publie un contenu. Le fichier dit encore gestionnaire de contenu."],["3","Camille","Filtre et traite la veille en lot."],["4","Camille","Lit les alertes analytics."],["5","Camille","Ouvre le front avec les yeux d'une personne."],["6","Camille","Règle les rôles et les permissions."],["7","Camille","Nettoie les rôles WooCommerce. Le fichier le place après le lancement."]],"protocole":[["Léa","Aucune entrée du back-office ne s'ouvre pour elle."],["Publication","Un brouillon ne sort pas sur le front. Les règles de publication du 01, du 01bis et du 01ter restent celles de ces cahiers."],["Impersonation","Camille voit le périmètre de la personne, et la session est tracée. Elle ne mélange pas son propre rôle avec cette vue."],["Lot","Une action groupée dit combien d'éléments elle touche avant de partir."]],"bo":[["Coquille","Navigation stable, tableaux, recherche."],["Contenus","Même geste de création pour les familles déjà spécifiées ailleurs."],["Personnes et rôles","Comptes, permissions, trace d'impersonation."],["Alertes","File, gravité, résolution."]],"pages":[],"sansMaquette":"Ce cahier n'a pas d'écran de front. Les besoins sont écrits dans l'onglet Back-office. Les maquettes de front des autres cahiers ne se dessinent pas ici."},{"id":"projets","titre":"11 Projets","fichier":"Première lecture de 11_Projects_SBO.md. Pas encore arbitrée.","objectif":"Un projet relie une équipe, des tâches et des compétences. La personne fait la tâche, un expert valide le jalon, le passeport peut monter. Une société ne voit pas le projet d'une autre.","point":"Le fichier fait créer le projet par un consultant TLS, et valider le jalon par un expert. Ni l'un ni l'autre n'a de prénom ici. Le 11 novembre ne réassigne que la création des parcours et des items. La création d'un projet n'est pas tranchée. L'auto-construction par IA est la feature 10 du 12bis, hors go-live : elle n'a pas de page.","regles":[["Création","Type, société, compétences, durée, équipe, tâches issues d'un modèle ou saisies, expert assigné, lancement et notifications."],["Tâche","Livrable, niveau Dreyfus attendu, durée, critères. Chloé dépose le travail. L'expert ou Marc demande une reprise ou valide."],["Jalon","L'expert confirme qu'un niveau est démontré. Le passeport se met à jour. La preuve reste."],["Marc","Il voit l'équipe, les retards et les écarts de compétence du projet."],["Isolation","Un projet appartient à une société. L'adresse d'une autre société ne l'ouvre pas."],["Modèles","Camille prépare les modèles de projet."]],"hors":[["Auto-construction par IA","Feature 10, après le lancement. Pas de bouton au go-live."],["Partage entre sociétés","Le fichier le réserve."],["Expert hors de sa société","Le fichier le réserve, comme le parcours 5 du 03."]],"journeys":[["1","Consultant TLS","Crée un projet d'upskilling. Prénom non fixé."],["2","Chloé","Fait une tâche, la soumet, et le jalon met à jour son passeport."],["3","Marc","Suit le projet et intervient sur un risque."],["4","Camille","Tient les modèles."]],"protocole":[["Autre société","Le projet est absent de la liste et l'adresse ne l'ouvre pas."],["Jalon refusé","La tâche revient avec le commentaire. Le niveau du passeport ne change pas."],["Jalon accepté","Le niveau visé est écrit dans le passeport, avec la preuve."],["Sans modèle","Camille peut quand même laisser créer un projet par tâches saisies, si ce rôle de création est confirmé."],["Auto-construction","Aucun bouton ne propose de générer le projet."]],"bo":[["Modèles","Tâches types, niveaux, critères."],["Projets","Société, équipe, expert, statut. Le créateur reste à nommer."]],"pages":[{"id":"projet","label":"Tableau du projet","qui":"Chloé ou Marc"},{"id":"tache","label":"Tâche","qui":"Chloé"},{"id":"jalon","label":"Validation du jalon","qui":"Expert ou Marc"},{"id":"equipe","label":"Équipe du projet","qui":"Marc"},{"id":"ecarts","label":"Écarts de compétences","qui":"Marc"}],"sansMaquette":""},{"id":"abonnement","titre":"11bis Abonnements","fichier":"Première lecture de 11bis_Subscription_Management_System.md. Pas encore arbitrée.","objectif":"L'individuel choisit un plan : gratuit, ou un des trois plans payants. La société reçoit un plan, des comptes, et Inès en ajoute. Le marquage gratuit d'un contenu est celui déjà retenu pour les parcours, les items et la veille.","point":"Les pages « hors abonnement » du 01, du 01bis et du 01ter sont le refus d'ouverture. Ce cahier décrit le choix du plan, le paiement et le marquage. L'écran de blocage de l'inventaire ne doit pas devenir une quatrième version de ce refus.","regles":[["Plans","Gratuit, puis trois plans. Le gratuit couvre ce que Camille a marqué accessible, déjà décrit dans les trois premiers cahiers."],["Paiement","Stripe. Renouvellement mensuel pour l'individuel, annuel pour la société, selon le fichier. Échec : trois relances, à 3, 5 et 7 jours."],["Montée","En cours de période, l'individuel paie l'écart au prorata. Le plan change tout de suite."],["Société","Camille crée la société et son plan. Inès ajoute des comptes, en achète au prorata, peut suspendre puis reprendre."],["Chloé","Elle ne choisit pas un plan. Elle reçoit le plan de sa société."],["Factures","Téléchargeables par l'individuel et par Inès."],["Faits","Création, renouvellement, échec, montée, pause et reprise partent vers le 10."]],"hors":[["Quatrième écran de refus","Le refus d'un contenu est déjà une page des cahiers 01, 01bis et 01ter."]],"journeys":[["1","Apprenant individuel","Choisit un plan à la fin de l'onboarding."],["2","Inès","Ajoute des comptes."],["3","Camille","Crée une société avec son plan."],["4","Inès","Invite des personnes dans la société."],["5","Apprenant individuel","Change de plan en cours de période."],["6","Inès","Suspend puis reprend l'abonnement."]],"protocole":[["Gratuit","Un contenu marqué gratuit s'ouvre. Un contenu non marqué est absent, et l'adresse directe dit la réserve, comme au 01."],["Marquage","Marquer gratuit n'enlève pas le contenu aux plans payants cochés."],["Échec de paiement","L'accès ne reste pas indéfiniment. Les relances partent. Après échec final, le plan retombe selon la règle encore à écrire précisément."],["Pause","Les personnes de la société ne s'ouvrent plus les contenus payants. La reprise les rouvre. La progression déjà faite reste."],["Invitation","Le lien ouvre la création du mot de passe, pas un deuxième compte."]],"bo":[["Catalogue","Plans, prix, ce qu'ils ouvrent."],["Société","Plan, nombre de comptes, suspension."],["Marquage","Le geste « accessible au gratuit » sur un parcours, un item ou une veille. Déjà décrit dans ces cahiers."]],"pages":[{"id":"choix","label":"Choix du plan","qui":"Apprenant individuel"},{"id":"plan","label":"Plan en cours","qui":"Apprenant individuel"},{"id":"paiement","label":"Paiement","qui":"Apprenant individuel"},{"id":"provision","label":"Compte ouvert par la société","qui":"Chloé"}],"sansMaquette":""},{"id":"chatbot","titre":"12 Chatbot","fichier":"Première lecture de 12_Chatbot_IA_et_QAR.md. Pas encore arbitrée.","objectif":"Une question en langage courant reçoit une réponse appuyée sur les contenus indexés, avec les sources. Si la confiance est basse, la réponse le dit et renvoie vers Léa ou l'aide. Le 12bis ne couvre pas cette conversation : il couvre les fonctions déclenchées par un bouton.","point":"Le fichier laisse un manager interroger les métriques de son équipe. C'est un accès aux données du 06 et du 10 par la conversation. À confirmer avant de le dessiner, surtout pour ce qui sortirait du périmètre de Marc.","regles":[["Réponse","La question cherche dans les contenus indexés, puis la réponse cite la source : leçon, item, mission, page d'aide."],["Index","Le contenu publié entre dans la base. Un brouillon n'y entre pas. Une modification met à jour l'index."],["Confiance","Sous le seuil, pas de réponse affirmative. Le message propose Léa ou l'aide."],["Retour","Utile ou pas utile, avec une remarque facultative."],["Vie privée","Un sujet bloqué ne produit pas de réponse. Le motif est dit."],["Historique","Les conversations restent, se cherchent, s'exportent, se suppriment."]],"hors":[["Fonctions bouton du 12bis","Positionnement, recommandations, alertes. Elles ne sont pas cet écran de conversation."]],"journeys":[["1","Chloé","Pose une question sur une formation et reçoit une réponse avec sa source."],["2","Marc","Pose une question sur les métriques de son équipe. Périmètre à confirmer."]],"protocole":[["Source","Chaque réponse affirmative a au moins un lien. Le lien ouvre le contenu si la personne a déjà le droit de le voir."],["Contenu réservé","La réponse ne révèle pas un contenu qu'un palier ou une société fermerait."],["Confiance basse","Le texte ne fabrique pas une réponse. Le renvoi vers Léa ou l'aide est présent."],["Suppression","Une conversation supprimée ne revient ni dans la recherche ni dans l'export."]],"bo":[["Base","Ce qui est indexé, ce qui est exclu."],["Seuil","Confiance minimale, sujets bloqués."],["Usage","Questions, utilité, échecs. Sans le texte d'une conversation dans un tableau ouvert à tout le monde."]],"pages":[{"id":"chat","label":"Conversation","qui":"Chloé ou Marc"},{"id":"sources","label":"Sources citées","qui":"Chloé ou Marc"},{"id":"retour","label":"Retour sur une réponse","qui":"Chloé ou Marc"},{"id":"doute","label":"Confiance basse","qui":"Chloé ou Marc"},{"id":"blocage","label":"Sujet bloqué","qui":"Chloé ou Marc"},{"id":"historique","label":"Historique","qui":"Chloé ou Marc"}],"sansMaquette":""},{"id":"cadreia","titre":"12bis Cadre des fonctions IA","fichier":"Première lecture de 12bis_IA_Features_Framework.md. Pas encore arbitrée.","objectif":"Catalogue de dix fonctions. Le fichier en met neuf dans le go-live, déclenchées dans un écran déjà prévu, pas dans une page à part. Chaque fonction se juge sur six points : où, quoi, ce que la personne y gagne, comment l'échec reste propre, le coût, la mesure.","point":"La feature 2, recommandation d'un item, est dans le go-live du fichier et hors go-live depuis le 11 novembre. La décision prime. Les features 5 et 7 sont aussi des recommandations : elles restent écrites ici et attendent le même arbitrage. La feature 1, questionnaire généré, recoupe la modale du 01 et l'onboarding du 03.","regles":[["1 Positionnement","Questionnaire généré. Priorité haute du fichier. À recouper avec le 01 et le 03."],["2 Items","Recommandation d'items. Écartée le 11 novembre. Elle ne s'ajoute à aucun écran."],["3 Parcours adaptatifs","Le fichier propose d'adapter un parcours au passeport. Pas encore tranché."],["4 Missions","Appariement d'une mission. Priorité basse du fichier."],["5 Lettre","Sélection du contenu de la lettre du 09. Même famille que la recommandation."],["6 Décrochage","Alerte à Léa quand une personne assignée décroche."],["7 Journal","Proposition à partir d'une entrée du 07. Le fichier la fait dépendre du journal."],["9 Société","Écarts de compétences pour Inès. Priorité basse du fichier."],["Moteur","Mistral en service externe au lancement. Bascule d'hébergement après. Chaque fonction a un interrupteur et une version de consigne."]],"hors":[["8 Atrophie prédictive","Catalogue seulement. Après le lancement."],["10 Projet généré","Après le lancement. Pas de bouton dans le 11."],["Matching de coach, sentiment, FAQ générée, transcription","Après le lancement, listés à part par le fichier."],["Étiquetage automatique","Écarté. Une suggestion de tags peut être proposée, Camille décide."]],"journeys":[["1","Apprenant","Passe le questionnaire généré. Recoupe 01 et 03."],["2","Chloé","Recevrait une recommandation d'item. Écarté le 11 novembre."],["3","Chloé","Verrait un parcours adapté. Non tranché."],["4","Léa","Reçoit une alerte de décrochage."],["5","Camille","Règle les interrupteurs, les consignes et suit le coût."]],"protocole":[["Feature 2","Aucun écran ne propose un item choisi par l'IA."],["Échec","Une fonction qui échoue laisse l'écran d'origine utilisable, sans réponse inventée."],["Interrupteur","Une fonction coupée disparaît de l'écran qui l'hébergeait."],["Transparence","Là où une proposition reste, le 13bis demande un signe visible et un refus motivé."],["Coût","Camille voit l'usage. Le fichier ne donne pas encore le seuil d'alerte."]],"bo":[["Interrupteurs","Une fonction à la fois, version de la consigne."],["Coût","Usage du service, par fonction."],["Revue","Les six points restent écrits à côté de chaque fonction avant qu'elle soit dessinée."]],"pages":[{"id":"transparence","label":"Signe sur une proposition","qui":"Chloé ou Léa"}],"sansMaquette":""},{"id":"aide","titre":"13 Aide et support","fichier":"Première lecture de 13_Helpcenter_Wiki_Support.md. Pas encore arbitrée.","objectif":"Deux canaux. L'aide dans l'application : recherche, articles, trois tutoriels, tickets. Un wiki public, hors de l'application, pour la documentation longue.","regles":[["Recherche","Titre et texte, catégories, filtres par type et par compétence, suggestions."],["Article","Texte, médias, sommaire, articles proches, et la question « utile ? »."],["Tutoriels","Trois parcours guidés, repris aussi dans le 03. On peut les quitter et les reprendre."],["Ticket","Catégorie, sujet, description, pièces. Fil avec le support. Statuts visibles."],["Wiki","Lien vers la documentation publique. Ce n'est pas une page de l'application."],["Qui","Chloé, Léa, Inès et Marc. Le fichier cite l'apprenant et le manager d'entreprise."]],"hors":[["Génération d'articles par IA","Le 12bis la place après le lancement."]],"journeys":[["1","Chloé","Cherche une réponse et ouvre un article."],["2","Inès","Ouvre la documentation utile au réglage de la société."]],"protocole":[["Recherche vide","Le message propose un ticket. Il ne fabrique pas un article."],["Utile","Le vote est enregistré. Il ne modifie pas l'article tout seul."],["Ticket","Sans sujet ou sans description, l'envoi ne part pas."],["Tutoriel quitté","La reprise ouvre la dernière étape, pas la première."]],"bo":[["Articles","Rédaction, catégorie, publication. Camille."],["Tickets","File, réponse, statut."],["Tutoriels","Les trois parcours et leurs étapes."]],"pages":[{"id":"accueil","label":"Accueil de l'aide","qui":"Chloé"},{"id":"resultats","label":"Résultats","qui":"Chloé"},{"id":"article","label":"Article","qui":"Chloé"},{"id":"tutoriels","label":"Tutoriels","qui":"Chloé"},{"id":"etape","label":"Étape de tutoriel","qui":"Chloé"},{"id":"tickets","label":"Mes tickets","qui":"Chloé"},{"id":"ticket","label":"Détail d'un ticket","qui":"Chloé"},{"id":"nouveau","label":"Nouveau ticket","qui":"Chloé"}],"sansMaquette":""},{"id":"conformite","titre":"13bis Confidentialité, IA et sécurité","fichier":"Première lecture de 13bis_GDPR_AI_Act_Security.md. Pas encore arbitrée.","objectif":"Règles communes à tous les cahiers. Consentement, export des données, suppression du compte, signe quand une proposition vient d'une IA, et règles de développement. Deux parcours du fichier sont des consignes pour le développement, pas des écrans.","regles":[["Consentement","Essentiel, mesure d'audience, prospection. L'essentiel n'est pas refusable. Le choix est daté et versionné. On le change dans le profil."],["Export","Chloé demande ses données. Camille traite dans les 30 jours. Le lien de téléchargement expire, le fichier dit 48 heures."],["Suppression","Demande, confirmation, puis effacement du profil et des données personnelles. Le fichier garde ce que la loi oblige à conserver, et le dit."],["IA","Une proposition générée porte un signe. Léa ou Camille peut la refuser en donnant un motif. Rejoint le 12bis."],["Sécurité","Validation des entrées, droits, traces. Ce sont des règles de construction, vérifiées dans chaque cahier, pas une page de Chloé."]],"hors":[["Outils externes de conformité","Le fichier dit que la technique peut s'appuyer sur eux. La règle, elle, reste dans ce cahier."]],"journeys":[["1","Développement","Applique la règle de consentement. Pas un écran."],["2","Camille","Traite une demande d'accès aux données."],["3","Développement","Pose le signe IA et le refus motivé."],["4","Développement","Applique la validation des entrées. Pas un écran."]],"protocole":[["Refus du non essentiel","La mesure d'audience et la prospection ne partent pas. Le compte fonctionne."],["Export","Le paquet contient le profil, l'apprentissage, le passeport, le journal, le coaching. Le lien meurt après le délai."],["Suppression","Sans la confirmation, rien n'est effacé. Après, la personne ne se reconnecte plus."],["Proposition IA","Sans le signe, la proposition ne s'affiche pas. Un refus sans motif n'est pas enregistré."]],"bo":[["Demandes","File des exports et des suppressions, délai, statut."],["Preuves","Version du texte acceptée, date, personne."],["Refus IA","Motif, fonction, personne, date."]],"pages":[{"id":"banniere","label":"Choix de consentement","qui":"Tous"},{"id":"reglages","label":"Consentements du profil","qui":"Tous"},{"id":"export","label":"Demande de mes données","qui":"Chloé"},{"id":"suppression","label":"Suppression du compte","qui":"Chloé"},{"id":"signe","label":"Signe d'une proposition IA","qui":"Chloé ou Léa"},{"id":"refus","label":"Refus motivé","qui":"Léa ou Camille"}],"sansMaquette":""},{"id":"consolidation","titre":"14 Consolidation avant le go-live","fichier":"Pas de fichier CDC métier. La liste du 16 mai en fait un processus, pas un module.","objectif":"Le moment où l'ensemble des cahiers 01 à 13bis est relu avant l'ouverture. Ce n'est pas un écran. Les décisions d'architecture et les vérifications tiennent dans les journaux déjà prévus pour cela.","regles":[["Périmètre","Tout ce qui est dans les cahiers fonctionnels part ensemble. On ne reporte pas un cahier entier à une deuxième ouverture."],["Hors package","Les cahiers 15 à 20, et ce que chaque cahier a rangé dans « hors de ce go-live », ne bloque pas cette consolidation."],["Ouverture","Une seule, quand le package est prêt. Pas de date dans ce document."]],"hors":[],"journeys":[["1","Camille et Pierre","Relisent les cahiers arbitrés, ferment les points encore ouverts, puis décident de l'ouverture."]],"protocole":[["Cahier ouvert","Un point marqué « à arbitrer » empêche de considérer le cahier comme prêt."],["Hors package","Une fonction explicitement après le lancement n'est pas un manque de cette consolidation."]],"bo":[["Aucun écran propre","Les vérifications utilisent les back-offices des autres cahiers."]],"pages":[],"sansMaquette":"Pas de maquette. Ce cahier ne décrit pas un écran."},{"id":"hors","titre":"15 à 20, après le lancement","fichier":"Liste du 16 mai. Pas de cahier à écrire avant le go-live.","objectif":"Ces six sujets existent pour qu'on ne les reconstruise pas à l'intérieur des cahiers du go-live. Ils n'ont pas d'écran dans ce document.","regles":[["15","Applications iOS et Android."],["16","Outil et agent IA."],["17","Apprentissage entre pairs."],["18","Place de marché des experts."],["19","Outil auteur, pour qu'un coach crée du contenu."],["20","Synchronisation externe et apprentissage juste à temps."]],"hors":[],"journeys":[["—","Personne, pour l'instant","Aucun parcours n'est spécifié. Les ranger ici empêche de les glisser dans un cahier du go-live."]],"protocole":[["Go-live","Aucun de ces six sujets n'est un critère d'ouverture."]],"bo":[["Aucun","Pas de back-office à écrire avant le lancement."]],"pages":[],"sansMaquette":"Pas de maquette. Ces cahiers n'ont pas de spécification d'écran."}];
function esc(valeur) {
  return String(valeur).replace(/[&<>]/g, (car) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[car]));
}
function tableau(entetes, lignes) {
  return `<table><tr>${entetes.map((h) => `<th>${h}</th>`).join("")}</tr>${lignes.map((ligne) => `<tr>${ligne.map((cellule) => `<td>${esc(cellule)}</td>`).join("")}</tr>`).join("")}</table>`;
}
function blocLecture(id, sous) {
  const lecture = LECTURES.find((item) => item.id === id);
  if (!lecture) return "<p>Ce cahier n'est pas dans la lecture.</p>";
  if (sous === "cahier") {
    return `<h2>${esc(lecture.titre)}</h2><p class="muted">${esc(lecture.fichier)}</p><p>${esc(lecture.objectif)}</p>${lecture.point ? `<div class="note"><b>Point à arbitrer.</b> ${esc(lecture.point)}</div>` : ""}<h3>Règles reprises du fichier</h3>${tableau(["Règle","Lecture"], lecture.regles)}${lecture.hors.length ? `<h3>Hors de ce go-live, selon le fichier</h3>${tableau(["Sujet","Lecture"], lecture.hors)}` : ""}`;
  }
  if (sous === "journeys") return `<h2>Parcours du fichier</h2><p class="muted">Numéros d'origine. Les prénoms sont ceux de ce document quand le rôle est déjà nommé.</p>${tableau(["N°","Personne","Parcours"], lecture.journeys)}`;
  if (sous === "protocole") return `<h2>Cas à reprendre</h2><p class="muted">Première liste, tirée des parcours du fichier. Le détail se fera cahier par cahier.</p>${tableau(["Cas","Résultat lu dans le fichier"], lecture.protocole)}`;
  if (sous === "bo") return `<h2>Back-office</h2><p class="muted">Besoins écrits. Pas d'écran.</p>${tableau(["Besoin","Ce que Camille y fait"], lecture.bo)}`;
  if (!lecture.pages.length) return `<h2>Maquette</h2><p>${esc(lecture.sansMaquette)}</p>`;
  const actif = lecture.pages.some((page) => page.id === etat.pageLecture) ? etat.pageLecture : lecture.pages[0].id;
  const page = lecture.pages.find((item) => item.id === actif);
  return `<h2>Pages du front</h2><p class="muted">${esc(page.qui)} · liste reprise de l'inventaire. Aucune de ces pages n'est dessinée.</p><div class="maquette"><div class="menu-pages">${lecture.pages.map((item) => `<button type="button" data-lp="${esc(item.id)}" class="${item.id===actif?"on":""}">${esc(item.label)}</button>`).join("")}</div><div class="feuille"><h3>${esc(page.label)}</h3><p>Cette page n'est pas encore dessinée.</p></div></div>`;
}

function rendu() {
  document.getElementById("haut").innerHTML = HAUT.map(([id,label]) => `<button class="pill ${etat.haut===id?"on":""}" data-haut="${id}">${label}</button>`).join("");
  const avecSous = etat.haut !== "presentation" && etat.haut !== "decisions";
  document.getElementById("sous").style.display = avecSous ? "flex" : "none";
  document.getElementById("sous").innerHTML = SOUS.map(([id,label]) => `<button class="pill ${etat.sous===id?"on":""}" data-sous="${id}">${label}</button>`).join("");
  let html = "";
  if (etat.haut==="presentation") html = pages.presentation();
  else if (etat.haut==="decisions") html = pages.decisions();
  else if (etat.haut==="parcours") html = blocParcours(etat.sous);
  else if (etat.haut==="items") html = blocItems(etat.sous);
  else if (etat.haut==="veille") html = blocVeille(etat.sous);
  else html = blocLecture(etat.haut, etat.sous);
  document.getElementById("vue").innerHTML = html;
}

document.body.addEventListener("click", (event) => {
  const t = event.target.closest("[data-haut],[data-sous],[data-ep],[data-ev],[data-of],[data-of-note],[data-note],[data-choix],[data-issue],[data-suite],[data-op],[data-note-p],[data-lp]");
  if (!t) return;
  if (t.dataset.haut) { etat.haut = t.dataset.haut; etat.sous = "cahier"; etat.pageLecture = ""; }
  if (t.dataset.sous) etat.sous = t.dataset.sous;
  if (t.dataset.ep) etat.ecranParcours = t.dataset.ep;
  if (t.dataset.ev) etat.ecranVeille = t.dataset.ev;
  if (t.dataset.of) { etat.ongletFil = t.dataset.of; etat.noteFil = ""; }
  if (t.dataset.ofNote) etat.noteFil = t.dataset.ofNote;
  if (t.dataset.note) etat.noteListe = t.dataset.note;
  if (t.dataset.choix) etat.choix = t.dataset.choix;
  if (t.dataset.issue) etat.issue = t.dataset.issue;
  if (t.dataset.suite) { etat.rang = 1; etat.choix = ""; }
  if (t.dataset.op) etat.ongletParcours = t.dataset.op;
  if (t.dataset.noteP) etat.noteParcours = t.dataset.noteP;
  if (t.dataset.lp) etat.pageLecture = t.dataset.lp;
  rendu();
});
document.getElementById("forme").addEventListener("submit", (event) => {
  event.preventDefault();
  if (document.getElementById("mdp").value === "1509") {
    document.body.classList.remove("ferme");
    document.getElementById("porte").remove();
    rendu();
  } else {
    document.getElementById("err").hidden = false;
    document.getElementById("mdp").select();
  }
});
</script>
</body>
</html>
